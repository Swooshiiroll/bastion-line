name: Feature
description: Something new for the game.
labels: [feature]
body:
  - type: textarea
    id: what
    attributes:
      label: What it is
      description: What the player sees and does.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details and rules
      description: Numbers, edge cases, links to design docs.
