name: Set up Godot
description: Installs Godot (headless-capable Linux build) and its Windows/Linux export templates, cached; imports the project; optionally a virtual display with software OpenGL for jobs that render.
inputs:
  version:
    description: Godot version
    default: "4.7.2"
  templates:
    description: Also install the export templates
    default: "false"
  display:
    description: Install Xvfb and Mesa (llvmpipe) for rendering jobs
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}-linux

    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot
        chmod +x ~/godot/godot

    - name: Cache export templates
      if: inputs.templates == 'true'
      id: cache-templates
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        key: godot-templates-${{ inputs.version }}-win-linux

    - name: Download export templates (Windows and Linux release only)
      if: inputs.templates == 'true' && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      run: |
        dest=~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        mkdir -p "$dest"
        curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
        unzip -q -j /tmp/templates.tpz templates/version.txt templates/linux_release.x86_64 templates/windows_release_x86_64.exe -d "$dest"
        rm /tmp/templates.tpz
        ls -la "$dest"

    - name: Virtual display
      if: inputs.display == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
        echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

    - name: Import project
      shell: bash
      run: |
        echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"
        GODOT=$HOME/godot/godot tools/dev.sh import
